<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SAMB Project Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: soft app shell — slim sidebar, dashboard of rounded panels, royal-blue active state and accent, taken from samb.co.id */
:root{
  --bg:#f1f4f9; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#2b3548; --muted:#7c88a1; --line:#e2e7f0;
  --pill:#3e55d8; --pill-fg:#ffffff; --accent:#3e55d8; --accent-soft:#e7ebfc; --focus:#3e55d8;
  --s-todo:#8a95ab; --s-progress:#3e55d8; --s-review:#7656e8; --s-done:#109e86; --danger:#d9402f; --danger-soft:#fbe2df;
  --review-soft:#ece7fd; --done-soft:#dcf3ee; --bad-ink:#b3301c; --warn-ink:#a8430b; --warn:#c8661a; --warn-soft:#fcefe1;
  --vc:#2f44b8; --vc-ink:#2f44b8; --brand-dot:#1b2a6b;
  --shadow:0 1px 2px rgba(43,53,72,.04),0 8px 24px rgba(43,53,72,.06);
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:22px; --r-md:14px; --lw:240px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1222; --surface:#151c30; --surface-2:#1b2440; --ink:#e5eaf5; --muted:#93a0bd; --line:#26314f;
  --pill:#7086f2; --pill-fg:#0d1222; --accent:#7086f2; --accent-soft:#1e2852; --focus:#7086f2;
  --s-todo:#8e9ab4; --s-progress:#7086f2; --s-review:#9a80ff; --s-done:#2cc4a8; --danger:#ff6a59; --danger-soft:#3d1d1a;
  --review-soft:#2a2445; --done-soft:#123a33; --bad-ink:#ff8a7a; --warn-ink:#ffa46b; --warn:#f0a060; --warn-soft:#3a2614;
  --vc:#3a50c8; --vc-ink:#a9b7ff; --brand-dot:#aab8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1222; --surface:#151c30; --surface-2:#1b2440; --ink:#e5eaf5; --muted:#93a0bd; --line:#26314f;
  --pill:#7086f2; --pill-fg:#0d1222; --accent:#7086f2; --accent-soft:#1e2852; --focus:#7086f2;
  --s-todo:#8e9ab4; --s-progress:#7086f2; --s-review:#9a80ff; --s-done:#2cc4a8; --danger:#ff6a59; --danger-soft:#3d1d1a;
  --review-soft:#2a2445; --done-soft:#123a33; --bad-ink:#ff8a7a; --warn-ink:#ffa46b; --warn:#f0a060; --warn-soft:#3a2614;
  --vc:#3a50c8; --vc-ink:#a9b7ff; --brand-dot:#aab8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
.side{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 8px}
.brand svg{display:block;width:118px;height:auto}
.brand .dot{fill:var(--brand-dot)} .brand .wm{fill:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,#ffb04a,#ee6420 60%,#c9410f);display:grid;place-items:center;color:#fff}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;padding-left:2px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:var(--muted);font-weight:600;cursor:pointer;min-width:0}
.nav button span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--pill);color:var(--pill-fg)}
.nav .ent{font-size:10.5px;font-weight:800;opacity:.65;margin-right:4px}
.entbar{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px}
.nav button:focus-visible{outline:2px solid var(--focus)}
.dot{width:10px;height:10px;border-radius:4px;flex:none;display:inline-block}
.nav .count{font-size:11px;font-family:var(--f-mono);opacity:.7}
.nav .badge{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px}
.icon-btn{all:unset;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--focus)}
.icon-btn:disabled{opacity:.3;cursor:default}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
.me-card{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);font-size:12.5px}
.main{flex:1;min-width:0;padding-block:28px 48px;padding-inline:clamp(16px,3vw,40px)}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{color:var(--muted);font-size:14px;font-weight:500}
.h1{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.08}
.menu-btn{display:none!important}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.btn.ok{background:var(--s-done);color:#fff;border-color:var(--s-done)}
.btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:18px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-weight:600;font-size:13px}
.stat.c1{background:var(--surface)} .stat.c2{background:var(--review-soft)} .stat.c3{background:var(--warn-soft)} .stat.c4{background:var(--danger-soft)}
.stat.c4 b{color:var(--danger)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:22px}
.pcard{all:unset;cursor:pointer;border-radius:var(--r-lg);padding:20px;color:#fff;display:flex;flex-direction:column;gap:12px;min-height:178px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s}
.pcard:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.pcard:hover{transform:translateY(-2px)}
.pcard h3{font-size:19px;font-weight:700;line-height:1.25;max-width:70%}
.pcard p{margin:0;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:72%}
.pcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:8px}
.pcard .meta{font-size:12.5px;font-weight:600}
.ring{position:absolute;top:18px;right:18px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(0,0,0,.18)}
.ring b{position:relative;z-index:1;font-size:14px;font-weight:800}
.pnew{all:unset;cursor:pointer;border:2px dashed var(--line);border-radius:var(--r-lg);min-height:178px;display:grid;place-items:center;color:var(--muted);font-weight:600;text-align:center;padding:20px}
.pnew:hover{border-color:var(--accent);color:var(--accent)}
.pnew:focus-visible{outline:2px solid var(--focus)}
.g-orange{background:linear-gradient(140deg,#d9530f,#9e3606)} .g-purple{background:linear-gradient(140deg,#7a35ad,#4a1f75)}
.g-teal{background:linear-gradient(140deg,#0c8a72,#08615c)} .g-blue{background:linear-gradient(140deg,#2f5ad6,#1c3a9e)}
.g-ink{background:linear-gradient(140deg,#3a4c5c,#14212c)} .g-pink{background:linear-gradient(140deg,#c2386a,#8c2049)}
.g-samb1{background:linear-gradient(140deg,#5d7fe9,#4466da)} .g-samb2{background:linear-gradient(140deg,#4b66e0,#3448c4)}
.g-samb3{background:linear-gradient(140deg,#3e53d4,#2b3aa6)} .g-samb4{background:linear-gradient(140deg,#35439f,#1f2a70)}
.g-slate{background:linear-gradient(140deg,#4a566e,#2b3548)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;border:2px solid var(--surface)}
.av.none{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.pcard .av{border-color:rgba(255,255,255,.7)}
.dl{display:flex;flex-direction:column}
.dl-item{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 8px;border-radius:12px}
.dl-item:hover{background:var(--surface-2)}
.dl-item:focus-visible{outline:2px solid var(--focus)}
.dl-item .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.late,.chip.stop{background:var(--danger-soft);color:var(--danger)}
.chip.soon,.chip.rescope{background:var(--warn-soft);color:var(--warn-ink)}
.chip.ok,.chip.lulus{background:var(--done-soft);color:var(--s-done)}
.chip.rv,.chip.siap{background:var(--review-soft);color:var(--s-review)}
.chip.on-dark{background:rgba(0,0,0,.22);color:#fff;font-size:12px}
.load{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--s-done)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.phead{border-radius:var(--r-lg);padding:24px;color:#fff;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end;box-shadow:var(--shadow)}
.phead .crumb{all:unset;cursor:pointer;font-size:13px;font-weight:600;opacity:.85}
.phead .crumb:hover{opacity:1;text-decoration:underline}
.phead h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.phead p{margin:0;max-width:62ch}
.phead .pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);width:min(260px,100%);overflow:hidden;margin-top:6px}
.phead .pbar i{display:block;height:100%;background:#fff;border-radius:99px}
.phead .btn{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.phead .btn:hover{background:rgba(255,255,255,.3)}
.phead .btn.white{background:#fff;color:#14212c}
.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pills{display:inline-flex;gap:6px;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow);flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}

.pills button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.pills button:hover{color:var(--ink)}
.pills button.on{background:var(--pill);color:var(--pill-fg)}
.pills button:focus-visible{outline:2px solid var(--focus)}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-width:0}
.field input,.field select{border:0;background:transparent;outline:0;min-width:0}
.field input{width:150px}
/* outcome & milestones */
.outcome{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:2px solid var(--ink);border-radius:var(--r-lg);padding:18px 20px;background:var(--surface)}
.outcome .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.outcome b{font-size:17px;display:block;margin:2px 0 4px}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.chain span{padding:3px 9px;border-radius:99px;background:var(--surface-2)}
.chain span.done{background:var(--done-soft);color:var(--s-done)}
.chain span.cur{background:var(--pill);color:var(--pill-fg)}
.chain span.goal{background:var(--ink);color:var(--surface)}
.ms{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px}
.ms-no{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:15px}
.ms.lulus .ms-no{background:var(--done-soft);color:var(--s-done)}
.ms.stop .ms-no{background:var(--danger-soft);color:var(--danger)}
.ms.siap .ms-no{background:var(--review-soft);color:var(--s-review)}
.ms h3{font-size:16.5px;font-weight:700;line-height:1.35}
.gate{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.gate div{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.gate small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ms-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.ms-prog{display:flex;align-items:center;gap:10px;min-width:180px;flex:1;max-width:340px}
.ms-prog .bar{flex:1}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.log div:last-child{border-bottom:0}
/* checklist */
.group{margin-bottom:6px}
.group-h{display:flex;align-items:center;gap:10px;padding:14px 4px 8px;font-weight:700;font-size:13.5px;flex-wrap:wrap}
.group-h .n{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 10px;border-radius:14px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface-2)}
.trow .open{all:unset;cursor:pointer;min-width:0}
.trow .open:focus-visible{outline:2px solid var(--focus)}
.tt{font-weight:600}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.line2{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.line2 b{color:var(--ink);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:5px;font-size:12.5px;font-weight:600}
.flag.f-bad{color:var(--bad-ink)} .flag.f-warn{color:var(--warn-ink)} .flag.f-info{color:var(--muted)}
.trow .st{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.racts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.racts .ra{padding:4px 10px;font-size:12px;gap:5px;border:1px solid var(--line)}
.racts svg{width:14px;height:14px;flex:none}
.ra-ok{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:4px 2px}
.stat.zero{opacity:.55}
.pills>button{flex:none;white-space:nowrap}
.meta-line{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-width:0}
.who .vl{font-size:11px;color:var(--muted)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.ck:hover{border-color:var(--s-done)}
.ck.on{background:var(--s-done);border-color:var(--s-done)}
.ck.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck.rv{border-color:var(--s-review);background:var(--review-soft)}
.ck.rv::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-review)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:260px;border:2px solid transparent;transition:border-color .12s}
.kcol.over{border-color:var(--accent)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px;font-weight:700}
.kcol-h small{font-weight:500;color:var(--muted);font-size:11.5px}
.kcol-h .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);padding:1px 8px;border-radius:99px}
.kcard{background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;cursor:grab;border-top:3px solid var(--sc)}
.kcard[draggable="false"]{cursor:pointer}
.kcard.dragging{opacity:.4}
.kcard .tt{font-weight:700;line-height:1.35}
.kcard .f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kcard:focus-visible{outline:2px solid var(--focus)}
.kempty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px;border:1.5px dashed var(--line);border-radius:var(--r-md)}
/* gantt */
.gwrap{overflow:auto;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);max-height:72vh}
.ginner{position:relative;min-width:max-content}
.grow{display:flex;height:46px;border-bottom:1px solid var(--line)}
.grow.msr{height:38px;background:var(--surface-2)}

  const late=ts.filter(isLate).length;if(late)bad.push(late+' task telat');

function saveTask(nt,old,commit){
  const p=project(nt.projectId);
  const m=mstone(nt.milestoneId);
  if(gated(p)){
    const changed=!old||old.start!==nt.start||old.end!==nt.end||old.assignee!==nt.assignee;
    let c=old?!!old.committed:false;
    if(commit===true)c=true;else if(commit==='off')c=false;else if(commit===false&&changed)c=false;
    else if(commit==null&&changed)c=!!(old&&old.assignee===nt.assignee&&canCommit(nt));
    if(c&&!(old&&old.committed&&!changed)){nt.committedAt=Date.now();nt.committedBy=meMember()?.id||'owner'}
    nt.committed=c&&!!nt.assignee;
  }
  put('tasks',nt);return nt;
}

/* ---------- data layer ---------- */
const queue={};
function writeErr(e){const c=e&&e.code;
  if(c==='invalid_argument'){BASE_RO=true;render();toast('Kamu hanya punya akses lihat. Minta akses Contributor ke pemilik.')}
  else if(c==='quota_exceeded')toast('Penyimpanan penuh. Hapus project lama dulu.');
  else toast('Gagal menyimpan. Coba lagi sebentar.')}
function upsert(col,obj){const a=S[col];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj)}
function put(col,obj){
  if(col==='tasks'){const m=mstone(obj.milestoneId), old=task(obj.id);
    if(m&&m.status==='lulus'&&!isDone(obj)){
      const why=!old||old.milestoneId!==obj.milestoneId?'ada task baru: ':'task dibuka lagi: ';
      upsert('milestones',{...m,status:null});put('milestones',{...m,status:null});
      put('decisions',{id:uid(),projectId:m.projectId,milestoneId:m.id,status:'rescope',note:'Keputusan dibuka lagi otomatis karena '+why+obj.title,by:meMember()?.id||'owner',at:Date.now()});
      pendingNote='Keputusan '+msNo(m)+' dibuka lagi karena '+why.replace(': ','');
    }}
  upsert(col,obj);schedule();
  if(LOCAL){saveLocal();return}
  const {id,...body}=obj;const k=col+'/'+id;
  queue[k]=(queue[k]||Promise.resolve()).then(()=>db.collection(col).doc(id).set(body)).catch(writeErr)}
function del(col,id){S[col]=S[col].filter(x=>x.id!==id);schedule();
  if(LOCAL){saveLocal();return}
  const k=col+'/'+id;queue[k]=(queue[k]||Promise.resolve()).then(()=>db.collection(col).doc(id).delete()).catch(writeErr)}
function saveLocal(){try{localStorage.setItem('gpm-local',JSON.stringify(S))}catch(e){}}
function schedule(){if(dragging){pending=true;return}render()}

async function init(){
  render();
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  try{CAL=JSON.parse(localStorage.getItem('gpm-cal')||'{}')||{}}catch(e){CAL={}}
  if(!db){LOCAL=true;try{Object.assign(S,JSON.parse(localStorage.getItem('gpm-local')||'{}'))}catch(e){}
    COLS.forEach(c=>{S[c]=S[c]||[];loaded.add(c)});render();return}
  try{const user=await window.claude.use('user');
    if(user){USER=user;ME.nouser=false;ME.uid=await user.id();ME.owner=!!(await user.isOwner());ME.admin=ME.owner||!!(await user.canEdit());
      const can=await user.can('data.write');if(can===false)BASE_RO=true}}catch(e){}
  if(ME.uid)db.doc(`data/users/${ME.uid}/calendar`).onSnapshot(sn=>{if(sn.exists){CAL=sn.data().items||{};schedule()}},()=>{});
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));loaded.add(c);schedule()},
      ()=>toast('Koneksi data terputus. Muat ulang halaman.'))});
}

/* ---------- inbox ---------- */
/* who: member id to view as, '' = viewer themself (permissions), '*' = everyone */
function inbox(who=''){
  const mm=meMember();
  const isP=id=>who==='*'?true:who?id===who:(ME.nouser||(mm&&id===mm.id));
  const valOK=t=>who?isP(validatorOf(t))||(who==='*'):canValidate(t);
  const decOK=id=>who?isP(id)||(who==='*'):canAct(id||'');
  const live=x=>pActive(project(x.projectId));
  const toValidate=S.tasks.filter(t=>live(t)&&t.stage==='review'&&gated(project(t.projectId))&&valOK(t));
  const gates=S.milestones.filter(m=>live(m)&&msState(m)==='siap'&&decOK(approverOf(m)));
  const stops=S.milestones.filter(m=>live(m)&&msState(m)==='stop'&&decOK(approverOf(m)));
  const closes=S.projects.filter(p=>readyToClose(p)&&decOK(pmOf(p)||''));
  const asks=S.asks.filter(a=>live(a)&&a.status!=='decided'&&decOK(deciderOf(a)));
  const commits=S.tasks.filter(t=>live(t)&&needsCommit(t)&&t.assignee&&t.stage!=='review'&&isP(t.assignee));
  const rejected=S.tasks.filter(t=>live(t)&&t.rejectReason&&!isDone(t)&&t.stage!=='review'&&isP(t.assignee));
  return {toValidate,gates,stops,closes,asks,commits,rejected,n:toValidate.length+gates.length+stops.length+closes.length+asks.length+commits.length+rejected.length};
}

function viewWeek(){

  const ws=addDays(weekStartOf(todayStr()),UI.wkOff*7), we=addDays(ws,6);
  const label=`Minggu ${isoWeek(ws)} · ${range(ws,we)} ${we.slice(0,4)}`;
  const opts=`${!ME.nouser&&mm?`<option value="" ${who===''?'selected':''}>Saya (${esc(mm.name)})</option>`:''}<option value="*" ${who==='*'?'selected':''}>Semua orang</option>${S.members.filter(m=>!mm||m.id!==mm.id).map(m=>`<option value="${m.id}" ${who===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}`;
  let out=head(UI.wkOff===0?'Apa yang harus jalan minggu ini':'Rencana per minggu',label,`<div class="wkbar"><button class="icon-btn" data-wk="-1" aria-label="Minggu sebelumnya">${IC.left}</button><button class="btn sm" data-wk="0" ${UI.wkOff===0?'disabled':''}>Minggu ini</button><button class="icon-btn" data-wk="1" aria-label="Minggu berikutnya">${IC.right}</button>
    <label class="field"><span class="sub">Lihat</span><select id="fAs" aria-label="Lihat sebagai">${opts}</select></label></div>`);
  const hs=holsIn(ws,we);
  if(hs.length)out+=`<div class="hols">${hs.map(h=>`<span class="chip ${h.type==='libur'?'late':'soon'}">${new Intl.DateTimeFormat('id-ID',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(dn(h.date)*864e5))} · ${esc(h.name)}</span>`).join('')}</div>`;
  else if(!holCovered(ws)||!holCovered(we))out+=`<div class="hols"><span class="chip">Data libur nasional hanya tersedia untuk ${HOL_YEARS.join(' dan ')}</span></div>`;

  const late=mine.filter(isLate).sort((a,b)=>a.end.localeCompare(b.end));
  const doneWk=S.tasks.filter(t=>pActive(project(t.projectId))&&isP(t.assignee)&&isDone(t)&&(t.acceptedAt||t.doneAt)&&localDs(t.acceptedAt||t.doneAt)>=ws&&localDs(t.acceptedAt||t.doneAt)<=we);
  const row=t=>`<button class="dl-item" data-task="${t.id}">${av(t.assignee)}<div style="min-width:0"><div class="tt">${esc(t.title)}</div><div class="sub">${pname(t)} · ${range(t.start,t.end)}${needsCommit(t)?' · <b>tanggal belum dikomit</b>':''}</div></div>${due(t)}</button>`;
  out+=`<div class="wkgrid"><div class="stack">${who===''||ME.nouser?calIssuesHtml():''}
    <section class="panel"><div class="panel-h"><h2>Perlu tindakan</h2><span class="sub">${ib.n} item</span></div>${actionList(ib,who!=='')}</section>
    <section class="panel"><div class="panel-h"><h2>Dikerjakan minggu ini</h2><span class="sub">${thisWeek.length} task</span></div>${thisWeek.length?`<div class="dl">${thisWeek.map(row).join('')}</div>`:`<div class="empty" style="padding:20px">Tidak ada task aktif di minggu ini.</div>`}</section>
  </div><div class="stack">
    <section class="panel"><div class="panel-h"><h2>Telat</h2><span class="sub">${late.length} task</span></div>${late.length?`<div class="dl">${late.map(row).join('')}</div>`:`<div class="empty" style="padding:20px">Tidak ada yang telat.</div>`}</section>
    <section class="panel"><div class="panel-h"><h2>Diterima minggu ini</h2><span class="sub">${doneWk.length} task</span></div>${doneWk.length?`<div class="dl">${doneWk.map(row).join('')}</div>`:`<div class="empty" style="padding:20px">Belum ada task yang diterima minggu ini.</div>`}</section>
  </div></div>`;
  return out;
}

    </section></div>`;

function taskFlags(t,p){
  if(isDone(t))return [];
  const F=[], B=(l,x)=>F.push([l,x]);
  if(t.rejectReason&&t.stage!=='review')B(0,'Ditolak: '+t.rejectReason);
  if(gated(p)&&selfAccept(t))B(0,'Pemeriksa sama dengan PIC, pilih pemeriksa lain');
  const deps=(t.deps||[]).map(task).filter(Boolean);
  if(deps.some(d=>d.end>=t.start))B(0,'Jadwal bentrok dengan task yang ditunggu');
  const sc=seqConflict(t);if(sc)B(1,`Mulai sebelum ${msNo(sc.pv)} selesai`);
  const hs=[t.start,t.end].filter((x,i,a)=>a.indexOf(x)===i).map(hol).filter(Boolean);
  if(hs.length)B(1,'Jatuh di hari libur: '+hs.map(h=>h.name).join(', '));
  if(durDays(t)>14)B(1,`Durasi ${durDays(t)} hari, sebaiknya dipecah`);
  if(needsCommit(t)&&t.stage!=='review')B(2,'Tanggal belum dikomit PIC');
  const blocked=deps.filter(d=>!isDone(d));if(blocked.length)B(2,'Menunggu: '+blocked.map(d=>d.title).join(', '));
  return F.sort((a,b)=>a[0]-b[0]);
}

function bindGantt(first){
  const wrap=$('#gwrap');if(!wrap)return;
  if(first)wrap.scrollLeft=Math.max(0,(dn(todayStr())-G.a-4)*G.DW);
  wrap.addEventListener('pointerdown',e=>{
    const bar=e.target.closest('.gbar');if(!bar||RO||e.button>0)return;
    const t=task(bar.dataset.bar);if(!t)return;
    if(locked(t)||(!canPlan(project(t.projectId))&&!canAct(t.assignee))){openTask(t.id);return}
    dragging={bar,t,resize:e.target.classList.contains('gh'),x:e.clientX,l:parseFloat(bar.style.left),w:parseFloat(bar.style.width),d:0,moved:false};
    bar.classList.add('dragging');bar.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',e=>{if(!dragging||!dragging.bar)return;const dx=e.clientX-dragging.x;if(Math.abs(dx)>4)dragging.moved=true;
    const d=Math.round(dx/G.DW);dragging.d=d;
    if(dragging.resize)dragging.bar.style.width=Math.max(G.DW,dragging.w+d*G.DW)+'px';else dragging.bar.style.left=(dragging.l+d*G.DW)+'px'});
  const end=()=>{if(!dragging||!dragging.bar)return;const {t,d,moved,resize,bar}=dragging;bar.classList.remove('dragging');dragging=null;
    if(!moved){openTask(t.id);pending=false;return}
    if(d!==0){const nt={...t};
      if(resize){nt.end=addDays(t.end,d);if(nt.end<nt.start)nt.end=nt.start}else{nt.start=addDays(t.start,d);nt.end=addDays(t.end,d)}
      const was=!!t.committed;saveTask(nt,t,null);const w=warnings(nt,project(nt.projectId)).filter(x=>!x.startsWith('Belum ada pemeriksa')&&!x.startsWith('Bukti'));
      toast('Jadwal diubah: '+range(nt.start,nt.end)+(was&&!nt.committed?' · tanggal jadi belum dikomit, PIC perlu komit ulang':'')+(w.length?' · '+w[0]:''))}
    else if(pending)render();
    pending=false};
  wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
}

function moveTo(t,stage){
  if(t.stage===stage){render();return}
  if(locked(t)){render();lockMsg();return}
  const p=project(t.projectId);
  if(!gated(p)){put('tasks',{...t,stage,doneAt:stage==='done'?Date.now():null});return}
  render();
  if(stage==='done'){toast(t.stage==='review'&&canValidate(t)?'Buka task untuk menerima atau menolak.':'Task masuk Done setelah diterima pemeriksa.');if(t.stage==='review'&&canValidate(t))openReview(t.id);return}
  if(stage==='review'){submitFlow(t);return}
  if(isDone(t)){toast('Task yang sudah diterima hanya bisa dibuka lagi oleh pemeriksanya.');if(canValidate(t))openReview(t.id);return}
  if(t.stage==='review'){if(canAct(t.assignee))put('tasks',{...t,stage});else toast('Hanya PIC yang bisa menarik pengajuan.');return}
  put('tasks',{...t,stage});
}

function digestFor(mid,date){
  const m=member(mid);if(!m)return null;
  const ib=inbox(mid), seen=new Set(), live=t=>pActive(project(t.projectId));
  const mine=S.tasks.filter(t=>live(t)&&t.assignee===mid&&!isDone(t)&&t.stage!=='review');
  const tk=t=>{const ms=mstone(t.milestoneId);return {id:t.id,title:t.title,sub:`${project(t.projectId)?.name||''}${ms?' · '+msNo(ms):''} · ${range(t.start,t.end)}`}};
  const once=(arr,f)=>arr.filter(x=>{const k=x.id;if(seen.has(k))return false;seen.add(k);return true}).map(f);
  const sec=[
    ['Deadline hari ini',once(mine.filter(t=>t.end===date),tk)],
    ['Sudah lewat deadline',once(mine.filter(t=>t.end<date).sort((a,b)=>a.end.localeCompare(b.end)),t=>({...tk(t),sub:tk(t).sub+` · telat ${dn(date)-dn(t.end)} hari`}))],
    ['Ditolak, perlu diperbaiki',once(ib.rejected,t=>({...tk(t),sub:'Alasan: '+(t.rejectReason||'-')}))],
    ['Tanggal perlu kamu komit',once(ib.commits,tk)],
    ['Mulai hari ini',once(mine.filter(t=>t.start===date),tk)],
    ['Perlu kamu periksa',once(ib.toValidate,t=>({...tk(t),sub:`Diajukan ${mname(t.assignee)||'PIC'} · ${project(t.projectId)?.name||''}`}))],
    ['Milestone perlu kamu putuskan',[...ib.gates.map(x=>({id:x.id,title:msNo(x)+' · '+x.title,sub:(project(x.projectId)?.name||'')+' · semua task diterima'})),...ib.stops.map(x=>({id:x.id,title:msNo(x)+' · '+x.title,sub:(project(x.projectId)?.name||'')+' · dihentikan, perlu tindak lanjut'}))]],
    ['Keputusan dibutuhkan',ib.asks.map(a=>({id:a.id,title:a.question,sub:(project(a.projectId)?.name||'')+(a.due?' · batas '+fmt(a.due):'')}))],
    ['Project siap ditutup',ib.closes.map(p=>({id:p.id,title:p.name,sub:'Semua milestone lulus · buktikan hasil akhir lalu tutup'}))]
  ].filter(x=>x[1].length).map(([title,items])=>({title,items}));
  return {member:m,date,sections:sec,count:sec.reduce((n,s)=>n+s.items.length,0)};
}
function emailFor(d){

  const subject=`[SAMB] ${d.count} hal untuk kamu hari ini · ${fmt(d.date,{weekday:'short',day:'numeric',month:'short'})}`;

  const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const html=`<div style="font-family:Arial,Helvetica,sans-serif;color:#14212c;max-width:560px;line-height:1.5"><p>Halo ${E(first)},</p><p>Ini yang perlu kamu lakukan hari ini (<b>${E(fmtLong(d.date))}</b>):</p>`+

    `<p style="margin-top:22px"><a href="${APP_URL}" style="background:#14212c;color:#fff;padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:bold">Buka SAMB Project Board</a></p><p style="color:#66727e;font-size:12px">Email ini dikirim otomatis setiap pagi hari kerja. Tidak ada email kalau tidak ada yang perlu kamu lakukan.</p></div>`;
  return {to:m.email||'',subject,text,html};

function digestAll(date){
  date=date||todayStr();
  const out={date,workday:isWork(date),paused:!!emailCfg().paused,emails:[],skipped:[],reminders:[],reminderSkips:[]};
  if(!out.paused){const q=reminderQueue();out.reminders=q.out;out.reminderSkips=q.skip}
  if(!out.workday){out.reason=hol(date)?'Hari libur: '+hol(date).name:'Akhir pekan';return out}
  if(out.paused){out.reason='Email harian sedang dijeda';return out}
  S.members.forEach(m=>{
    if(!m.email||!EMAIL_RE.test(m.email)){out.skipped.push({memberId:m.id,name:m.name,reason:'Belum ada email'});return}
    if(m.emailDaily===false){out.skipped.push({memberId:m.id,name:m.name,reason:'Email harian dimatikan'});return}
    const d=digestFor(m.id,date);
    if(!d.count){out.skipped.push({memberId:m.id,name:m.name,reason:'Tidak ada yang perlu dilakukan'});return}
    out.emails.push({memberId:m.id,name:m.name,count:d.count,...emailFor(d)});
  });
  return out;
}

/* Officer tidak boleh jadi PM, pemeriksa, atau pemutus: kosongkan semua rujukannya */
function clearPMRefs(id){
  S.projects.filter(x=>x.owner===id).forEach(x=>put('projects',{...x,owner:''}));
  S.milestones.filter(x=>x.approver===id).forEach(x=>put('milestones',{...x,approver:''}));
  S.tasks.filter(x=>x.validator===id).forEach(x=>put('tasks',{...x,validator:''}));
  S.asks.filter(x=>x.decider===id&&x.status==='open').forEach(x=>put('asks',{...x,decider:''}));
}
function emailErr(email,selfId){
  if(!email)return '';
  if(!EMAIL_RE.test(email))return 'Format email belum benar, mis. nama@gastronenergy.com.';
  if(S.members.some(x=>x.id!==selfId&&(x.email||'').toLowerCase()===email))return 'Email ini sudah dipakai anggota lain.';
  return '';
}

function openModal(html,mount,sticky){const r=$('#modalRoot');r.innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  if(!sticky)$('#scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim')closeModal()});mount&&mount(r);const f=r.querySelector('input:not([type=radio]):not([type=checkbox]),textarea,select');f&&f.focus()}

function twoStep(btn,label,fn){btn.dataset.orig=btn.textContent;btn.addEventListener('click',()=>{if(btn.dataset.arm){fn();return}btn.dataset.arm=1;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=btn.dataset.orig}},4000)})}

function need(pairs){let first=null;

  if(first){first[0].focus();return first[1]}return ''}

function reaches(from,target,seen=new Set()){if(from===target)return true;if(seen.has(from))return false;seen.add(from);return (task(from)?.deps||[]).some(d=>reaches(d,target,seen))}
function warnings(t,p){
  const w=[];if(!t.start||!t.end)return [];
  const W=(pr,s)=>w.push([pr,s]);
  const dd=dn(t.end)-dn(t.start)+1;
  const DN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  if(gated(p)){
    if(selfAccept(t))W(1,`Pemeriksa task ini jatuh ke ${mname(validatorOf(t))}, yang juga PIC-nya. Pilih pemeriksa lain.`);
    else if(!t.validator)W(10,`Belum ada pemeriksa. Yang menerima nanti: ${mname(validatorOf(t))||'Project Manager'}.`);
    if(!t.proof)W(11,'Bukti yang diminta belum diisi. Tanpa ini pemeriksa tidak punya patokan.');
  }
  const m=mstone(t.milestoneId);
  if(m){
    if(msState(m)==='stop')W(2,`${msNo(m)} sedang dihentikan.`);
    const sc=seqConflict(t);if(sc)W(3,`Mulai sebelum ${msNo(sc.pv)} selesai (${fmt(sc.pe)}), padahal ${msNo(sc.pv)} belum lulus.`);
    if(m.target&&t.end>m.target)W(5,`Selesai setelah target ${msNo(m)} (${fmt(m.target)}).`);
    if(msState(m)==='lulus'&&!isDone(t)&&(!task(t.id)||task(t.id).milestoneId!==t.milestoneId))W(6,`${msNo(m)} sudah lulus. Menambah task di sini akan membuka keputusannya lagi.`);
  }
  (t.deps||[]).map(task).filter(Boolean).forEach(d=>{if(d.end>=t.start)W(4,`Mulai sebelum "${d.title}" selesai (${fmt(d.end)}).`)});
  const hs=hol(t.start), he=hol(t.end);
  if(hs)W(7,`Tanggal mulai jatuh di ${hs.type==='libur'?'libur nasional':'cuti bersama'}: ${hs.name}.`);
  if(he&&t.end!==t.start)W(7,`Tanggal selesai jatuh di ${he.type==='libur'?'libur nasional':'cuti bersama'}: ${he.name}.`);
  if([0,6].includes(dow(t.start)))W(8,`Tanggal mulai jatuh di hari ${DN[dow(t.start)]}.`);
  if([0,6].includes(dow(t.end)))W(8,`Tanggal selesai jatuh di hari ${DN[dow(t.end)]}.`);
  if(dd>14)W(9,`Durasi ${dd} hari. Task di atas ~2 minggu sebaiknya dipecah jadi beberapa task.`);
  const mid=holsIn(t.start,t.end).filter(h=>h.date!==t.start&&h.date!==t.end&&![0,6].includes(dow(h.date)));
  if(mid.length)W(12,`Rentang ini melewati ${mid.length} hari libur/cuti bersama (${mid.map(h=>fmt(h.date)+' '+h.name).join(', ')}).`);
  if(!holCovered(t.start)||!holCovered(t.end))W(13,`Data libur nasional hanya tersedia untuk ${HOL_YEARS.join(' dan ')}.`);
  return w.sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}

      if(g){const cw=$('#tCommitWrap'),can=!!v.assignee&&canCommit(v);cw.hidden=!can;
        const mm=meMember();$('#tCommitLbl').textContent=mm&&mm.id===v.assignee||ME.nouser?'Saya komit tanggal ini':'Tandai komit atas nama '+(mname(v.assignee)||'PIC');
        const changed=id&&(t.start!==v.start||t.end!==v.end||t.assignee!==v.assignee);
        if(changed&&t.committed&&!cw.dataset.touched)$('#tCommit').checked=false;
        $('#tCommitInfo').innerHTML=can?'':(v.assignee?`Status tanggal: <b>${t.committed&&!changed?'Dikomit':'Belum dikomit'}</b>. Hanya ${esc(mname(v.assignee))} yang bisa mengomit.`:'Pilih PIC dulu. Tanggal baru bisa dikomit oleh PIC-nya.')}
      renderWarn($('#tWarn'),warnings(v,p));

    r.querySelector('.modal').addEventListener('input',upd);r.querySelector('.modal').addEventListener('change',upd);upd();
    $('#tCancel').onclick=closeModal;
    $('#tSave').onclick=()=>{const v=read();
      const e=need([[$('#tTitle'),'Isi judul task.'],[g&&pms(p.id).length?$('#tMs'):null,'Pilih milestone.'],[$('#tStart'),'Isi tanggal mulai.'],[$('#tEnd'),'Isi tanggal selesai.'],[$('#tWho'),'Pilih PIC.'],[g?$('#tVal'):null,'Pilih pemeriksa.'],[g?$('#tProof'):null,'Tulis bukti yang diminta.']]);
      if(e){$('#tErr').textContent=e;return}
      if(!v.title){$('#tErr').textContent='Isi judul task dulu.';return}
      if(!v.start||!v.end){$('#tErr').textContent='Isi tanggal mulai dan selesai.';return}
      if(v.end<v.start){$('#tErr').textContent='Tanggal selesai tidak boleh sebelum tanggal mulai.';return}
      if(g&&v.assignee&&v.assignee===v.validator){$('#tErr').textContent='Pemeriksa tidak boleh orang yang sama dengan PIC.';return}
      if(g&&selfAccept(v)){$('#tErr').textContent='Penerima task ini jatuh ke PIC-nya sendiri. Pilih pemeriksa lain.';return}
      if(g&&pms(p.id).length&&!v.milestoneId){$('#tErr').textContent='Pilih milestone. Di project dengan alur pemeriksaan, setiap task harus masuk milestone.';return}
      if(!g)v.doneAt=v.stage==='done'?(t.doneAt||Date.now()):null;
      let cm=false;if(g){const cw=$('#tCommitWrap');if(!cw.hidden)cm=$('#tCommit').checked?true:'off'}
      const saved=saveTask({...v,id:id||uid(),createdAt:t.createdAt||Date.now()},id?t:null,cm);
      closeModal();toast((id?'Task disimpan':'Task ditambahkan')+(g&&!saved.committed?' · tanggal belum dikomit PIC':''))};
    const d=$('#tDel');if(d)twoStep(d,'Klik lagi untuk hapus',()=>{S.tasks.filter(x=>(x.deps||[]).includes(id)).forEach(x=>put('tasks',{...x,deps:x.deps.filter(y=>y!==id)}));S.reminders.filter(r=>r.taskId===id&&r.status==='menunggu').forEach(r=>put('reminders',{...r,status:'dibatalkan',note:'Task dihapus'}));del('tasks',id);closeModal();toast('Task dihapus')});
  });
}

function submitFlow(t){
  if(RO)return;
  if(!t.assignee){toast('Tentukan PIC dulu sebelum mengajukan.');openTask(t.id);return}
  if(!canAct(t.assignee)){toast('Hanya PIC ('+mname(t.assignee)+') yang bisa mengajukan task ini.');return}
  const blocked=(t.deps||[]).map(task).filter(d=>d&&!isDone(d));
  openModal(`<h2>Ajukan selesai</h2><div class="prompt"><b>${esc(t.title)}</b><br><span class="sub">Pemeriksa: ${esc(mname(validatorOf(t))||'Project Manager')}</span></div>
    ${blocked.length?`<div class="warn"><div>Task ini masih menunggu: ${esc(blocked.map(d=>d.title).join(', '))}. Pastikan memang sudah bisa diajukan.</div></div>`:''}
    <div class="f">Bukti yang diminta<div class="evidence">${t.proof?esc(t.proof):'<span class="sub">Tidak ditentukan. Jelaskan hasil kerjamu sejelas mungkin.</span>'}</div></div>
    <label class="f">Bukti yang diajukan<span class="hint">Tempel link dokumen, foto, atau tulis ringkasan hasil yang bisa dicek.</span><textarea class="inp" id="sEv" placeholder="https://drive.google.com/... atau catatan hasil">${esc(t.evidence||'')}</textarea></label>
    <div class="err" id="sErr"></div>
    <div class="mfoot"><span></span><div class="row"><button class="btn ghost" id="sCancel">Batal</button><button class="btn primary" id="sSave">Ajukan ke pemeriksa</button></div></div>`,
  ()=>{
    $('#sCancel').onclick=closeModal;
    $('#sSave').onclick=()=>{const ev=$('#sEv').value.trim();if(!ev){$('#sErr').textContent='Isi bukti dulu. Pemeriksa butuh sesuatu untuk dicek.';return}
      put('tasks',{...t,stage:'review',evidence:ev,submittedAt:Date.now(),submittedBy:meMember()?.id||t.assignee});closeModal();toast('Diajukan. Menunggu diperiksa '+(mname(validatorOf(t))||'Project Manager')+'.')};
  });
}
function openReview(id){
  const t=task(id);if(!t)return;const p=project(t.projectId);const g=gated(p);
  const val=canValidate(t)&&!RO, pic=canAct(t.assignee)&&!RO;
  const ms=mstone(t.milestoneId);
  let actions='';
  if(g&&t.stage==='review'&&val)actions=`<button class="btn danger" id="rRej">Tolak</button><button class="btn ok" id="rAcc">Terima</button>`;
  else if(g&&t.stage==='review'&&pic)actions=`<button class="btn" id="rWd">Tarik pengajuan</button>`;
  else if(g&&isDone(t)&&val)actions=`<button class="btn" id="rReopen">Buka lagi task</button>`;
  const cmOK=g&&needsCommit(t)&&t.assignee&&canCommit(t)&&!RO&&t.stage!=='review';
  if(cmOK)actions+=`<button class="btn primary" id="rCommit">${meMember()?.id===t.assignee||ME.nouser?'Komit tanggal':'Komit atas nama PIC'}</button>`;
  openModal(`<h2>${esc(t.title)}</h2>
    <div class="row" style="gap:6px"><span class="chip s-${t.stage}" style="color:var(--sc)">${STAGES.find(s=>s.id===t.stage).name}</span>${ms?`<span class="chip">${msNo(ms)} · ${esc(ms.title)}</span>`:''}<span class="chip">${range(t.start,t.end)}</span></div>
    <div class="fgrid"><div class="f">PIC<div class="row" style="gap:8px;color:var(--ink)">${av(t.assignee)}${esc(mname(t.assignee)||'Belum ditugaskan')}</div></div>
    ${g?`<div class="f">Pemeriksa<div class="row" style="gap:8px;color:var(--ink)">${av(validatorOf(t))}${esc(mname(validatorOf(t))||'Project Manager')}</div></div>`:''}</div>
    ${g&&!isDone(t)?`<div class="sub">${workdays(t.start,t.end)} hari kerja · Tanggal: <b style="color:var(--ink)">${t.committed?'Dikomit':'Belum dikomit'}</b>${t.committed&&t.committedAt?' oleh '+esc(mname(t.committedBy)||'')+' · '+fmtTs(t.committedAt):''}${!t.committed&&!cmOK&&t.assignee?' · menunggu dikomit '+esc(mname(t.assignee)):''}</div>`:''}
    ${t.desc?`<div class="f">Catatan<div class="evidence">${linkify(t.desc)}</div></div>`:''}
    ${g?`<div class="f">Bukti yang diminta<div class="evidence">${t.proof?esc(t.proof):'<span class="sub">Tidak ditentukan</span>'}</div></div>`:''}
    ${t.evidence?`<div class="f">Bukti yang diajukan${t.submittedAt?` <span class="hint">· ${fmtTs(t.submittedAt)}</span>`:''}<div class="evidence">${linkify(t.evidence)}</div></div>`:''}
    ${isDone(t)&&t.acceptedAt?`<div class="sub">Diterima ${esc(mname(t.acceptedBy)||'')} · ${fmtTs(t.acceptedAt)}</div>`:''}
    ${g&&selfAccept(t)&&!isDone(t)?`<div class="warn"><div>Penerima task ini jatuh ke ${esc(mname(t.assignee))}, yang juga PIC-nya, jadi tidak ada yang bisa menerimanya. ${t.stage==='review'?'Tarik pengajuan, lalu e':'E'}dit task dan pilih pemeriksa lain.</div></div>`:''}
    ${g&&t.stage==='review'&&!val&&!pic?`<div class="sub">Menunggu keputusan ${esc(mname(validatorOf(t))||'Project Manager')}.</div>`:''}
    ${taskActionsHtml(t)}
    <div id="rejBox" hidden><label class="f">Alasan penolakan<textarea class="inp" id="rReason" placeholder="Apa yang kurang dan apa yang harus diperbaiki"></textarea></label></div>
    <div class="err" id="rErr"></div>
    <div class="mfoot"><div>${!RO&&(!g||!(t.stage==='review'||isDone(t)))?`<button class="btn ghost" id="rEdit">Edit task</button>`:''}</div><div class="row"><button class="btn ghost" id="rClose">Tutup</button>${actions}</div></div>`,
  ()=>{
    $('#rClose').onclick=closeModal;
    const by=()=>meMember()?.id||'owner';
    const e=$('#rEdit');if(e)e.onclick=()=>{closeModal();openTask(id)};
    const acc=$('#rAcc');if(acc)acc.onclick=()=>{put('tasks',{...t,stage:'done',acceptedAt:Date.now(),acceptedBy:by(),rejectReason:null,doneAt:Date.now()});closeModal();toast('Task diterima ✓')};
    const rej=$('#rRej');if(rej)rej.onclick=()=>{const box=$('#rejBox');if(box.hidden){box.hidden=false;rej.textContent='Kirim penolakan';$('#rReason').focus();return}
      const reason=$('#rReason').value.trim();if(!reason){$('#rErr').textContent='Tulis alasan supaya PIC tahu apa yang harus diperbaiki.';return}
      put('tasks',{...t,stage:'progress',rejectReason:reason,rejectedAt:Date.now(),rejectedBy:by()});closeModal();toast('Task dikembalikan ke PIC')};
    const rc=$('#rCommit');if(rc)rc.onclick=()=>{saveTask({...t},t,true);closeModal();toast('Tanggal dikomit: '+range(t.start,t.end))};
    const wd=$('#rWd');if(wd)wd.onclick=()=>{put('tasks',{...t,stage:'progress'});closeModal();toast('Pengajuan ditarik')};
    const ro=$('#rReopen');if(ro)ro.onclick=()=>{put('tasks',{...t,stage:'progress',acceptedAt:null,acceptedBy:null,doneAt:null});
      closeModal();toast('Task dibuka lagi')};
  });
}
function onCheck(id){
  const t=task(id);if(!t||RO)return;const p=project(t.projectId);
  if(locked(t)){lockMsg();return}
  if(!gated(p)){const done=!isDone(t);put('tasks',{...t,stage:done?'done':'progress',doneAt:done?Date.now():null});toast(done?'Task selesai ✓':'Task dibuka lagi');return}
  if(t.stage==='review'||isDone(t)){openReview(id);return}
  submitFlow(t);
}

/* ---------- Wizard: Rancang project ---------- */
let WZ=null;
const WZ_NAMES={tim:'Tim',hasil:'Hasil akhir',milestone:'Milestone',task:'Task',periksa:'Pemeriksaan',ringkasan:'Ringkasan'};
function nextWorkday(s){let d=s;while(!isWork(d))d=addDays(d,1);return d}
function wzSteps(){return [...(WZ.withTeam?['tim']:[]),'hasil','milestone','task','periksa','ringkasan']}
function startWizard(){
  if(!canCreate()){toast('Hanya Project Manager yang bisa melakukan ini.');return}
  WZ={step:0,withTeam:!S.members.length&&isAdmin(),members:'',pms:'',name:'',outcome:'',measure:'',owner:meMember()?.id||'',gate:true,validator:'',ms:[],tasks:{},entity:UI.ent||'',color:GRADS[S.projects.length%GRADS.length]};
  renderWizard();
}
function wzSave(){
  const r=$('#modalRoot');if(!r||!WZ)return;
  const v=id=>{const el=r.querySelector('#'+id);return el?el.value:undefined};
  const st=wzSteps()[WZ.step];
  if(st==='tim'){WZ.members=v('wzMembers')??WZ.members;WZ.pms=v('wzPMs')??WZ.pms}
  if(st==='hasil'){WZ.name=v('wzName').trim();WZ.entity=v('wzEnt')||'';WZ.outcome=v('wzOutcome').trim();WZ.measure=v('wzMeasure').trim();WZ.owner=v('wzOwner')}
  if(st==='milestone'){r.querySelectorAll('[data-wzms]').forEach(el=>{const m=WZ.ms.find(x=>x.id===el.dataset.wzms);if(m)m[el.dataset.k]=el.value.trim?el.value.trim():el.value})}
  if(st==='task'){r.querySelectorAll('[data-wzt]').forEach(el=>{for(const k in WZ.tasks){const t=WZ.tasks[k].find(x=>x.id===el.dataset.wzt);if(t)t[el.dataset.k]=el.dataset.k==='title'?el.value.trim():el.value}})}
  if(st==='periksa'){WZ.validator=v('wzVal');WZ.gate=r.querySelector('#wzGate').checked}
}
function wzTaskDefaults(mid){
  const order=WZ.ms.map(m=>m.id), i=order.indexOf(mid);
  let last=null;
  for(let k=i;k>=0&&!last;k--){const arr=WZ.tasks[order[k]]||[];if(arr.length)last=arr[arr.length-1].end}
  const start=nextWorkday(last?addDays(last,1):todayStr());
  return {id:uid(),title:'',pic:'',start,end:addDays(start,4)};
}

    <label class="f"><span>Officer, satu per baris</span><textarea class="inp" id="wzMembers" rows="4" placeholder="Budi&#10;Sari">${esc(WZ.members)}</textarea><span class="hint">Mengerjakan task.</span></label>`;
  if(st==='hasil')body=`<div class="wz-q">Apa yang ingin dicapai project ini?${tip('hasil')}</div>

    <label class="f"><span>Cara tahu sudah tercapai${tip('ukur')}</span><input class="inp" id="wzMeasure" value="${esc(WZ.measure)}" placeholder="mis. Total kontribusi semua principal sama dengan P&amp;L SAMB, selisih nol"></label>
    <label class="f"><span>Siapa PM-nya?${tip('pm')}</span><select class="inp" id="wzOwner">${pmOpts(WZ.owner,'Pilih PM…')}</select></label>`;
  if(st==='milestone'){

    body=`<div class="wz-q">Apa yang harus sudah benar tepat sebelum <span style="color:var(--accent)">${esc(tgt)}</span> tercapai?${tip('mundur')}</div>

      <div><button class="btn sm" data-wztadd="${m.id}">${IC.plus} Tambah task</button></div></div>`}).join('')||`<div class="empty">Belum ada milestone. Kembali ke langkah sebelumnya untuk menambahkannya.</div>`}`;
  }
  if(st==='periksa'){

    r.querySelectorAll('[data-wzmsdel]').forEach(b=>b.onclick=()=>{wzSave();WZ.ms=WZ.ms.filter(m=>m.id!==b.dataset.wzmsdel);delete WZ.tasks[b.dataset.wzmsdel];renderWizard()});

function wzValidate(st){
  const E=(msg,bad=[])=>({msg,bad});
  if(st==='tim'){const has=x=>x.split(/\n|,/).some(y=>y.trim()), bad=[!has(WZ.pms)&&'#wzPMs',!has(WZ.members)&&'#wzMembers'].filter(Boolean);
    if(bad.length)return E(bad.length>1?'Tulis minimal satu Project Manager dan satu Officer.':bad[0]==='#wzPMs'?'Tulis minimal satu Project Manager.':'Tulis minimal satu Officer.',bad)}
  if(st==='hasil'){
    const miss=[['name','#wzName','Isi nama project.'],['entity','#wzEnt','Pilih entitasnya.'],['outcome','#wzOutcome','Tulis hasil akhirnya.'],['measure','#wzMeasure','Tulis cara tahu hasil akhir sudah tercapai.'],['owner','#wzOwner','Pilih PM-nya.']].filter(x=>!WZ[x[0]]);
    if(miss.length)return E(miss[0][2],miss.map(x=>x[1]));
  }
  if(st==='milestone'){
    if(!WZ.ms.length)return E('Tambahkan minimal satu milestone.',['#wzMsNew','#wzMsDate']);
    const bad=[];WZ.ms.forEach(m=>{if(!m.title)bad.push(`[data-wzms="${m.id}"][data-k="title"]`);if(!m.target)bad.push(`[data-wzms="${m.id}"][data-k="target"]`)});
    if(bad.length)return E('Lengkapi kondisi dan target tanggal setiap milestone.',bad);
    for(let i=1;i<WZ.ms.length;i++)if(WZ.ms[i].target<WZ.ms[i-1].target)return E(`Target M${i+1} (${fmt(WZ.ms[i].target)}) lebih awal dari M${i} (${fmt(WZ.ms[i-1].target)}). Urutan target harus maju.`,[`[data-wzms="${WZ.ms[i].id}"][data-k="target"]`]);
  }
  if(st==='task'){
    const empty=WZ.ms.findIndex(m=>!(WZ.tasks[m.id]||[]).length);
    if(empty>=0)return E(`Tambahkan minimal satu task untuk M${empty+1}.`,[`[data-wztadd="${WZ.ms[empty].id}"]`]);
    const bad=[];let first='';
    WZ.ms.forEach((m,i)=>(WZ.tasks[m.id]||[]).forEach(t=>{
      [['title','judul'],['pic','PIC'],['start','tanggal mulai'],['end','tanggal selesai']].forEach(([k,l])=>{if(!t[k]){bad.push(`[data-wzt="${t.id}"][data-k="${k}"]`);first=first||`Isi ${l} task di M${i+1}.`}});
      if(t.start&&t.end&&t.end<t.start){bad.push(`[data-wzt="${t.id}"][data-k="end"]`);first=first||`Tanggal selesai "${t.title||'task'}" sebelum tanggal mulai.`}}));
    if(bad.length)return E(first,bad);
  }
  if(st==='periksa'&&WZ.gate){
    if(!WZ.validator)return E('Pilih pemeriksa.',['#wzVal']);
    const self=Object.values(WZ.tasks).flat().filter(t=>t.pic===WZ.validator&&t.pic===WZ.owner);
    if(self.length)return E(`Pemeriksa dan PM sama-sama PIC untuk "${self[0].title}", jadi tidak ada yang bisa memeriksanya. Pilih pemeriksa lain.`,['#wzVal']);
  }
  return null;
}

const remFor=tid=>S.reminders.filter(r=>r.taskId===tid).sort((a,b)=>(b.at||0)-(a.at||0));
/* Satu aturan untuk status di app dan untuk mesin pengirim */
function remWhy(r){const t=task(r.taskId), m=member(r.toMember);
  if(!t)return 'Task sudah dihapus';if(isDone(t))return 'Task sudah selesai';if(!pActive(project(t.projectId)))return 'Project tidak aktif';
  if(!m)return 'Penerima sudah dihapus';if(t.assignee!==m.id)return 'PIC task sudah diganti';if(!m.email||!EMAIL_RE.test(m.email))return 'Penerima belum punya email';return ''}
const remPending=tid=>remFor(tid).find(r=>r.status==='menunggu'&&!remWhy(r));
const mailActive=()=>S.emaillog.length>0;
function remStatusText(r){const who=mname(r.toMember)||'PIC';
  if(r.status==='menunggu'&&remWhy(r))return `Pengingat ke ${who} tidak akan terkirim: ${remWhy(r).toLowerCase()}.`;
  if(r.status==='menunggu')return `Pengingat ke ${who} menunggu dikirim (dicatat ${fmtTs(r.at)}). ${mailActive()?'Dikirim pada putaran pengiriman berikutnya.':'Pengiriman aktif setelah email disambungkan.'}`;
  if(r.status==='terkirim')return `Pengingat terakhir terkirim ke ${who} · ${fmtTs(r.sentAt||r.at)}`;
  return `Pengingat ke ${who} ${r.status==='gagal'?'gagal dikirim':'dibatalkan'}${r.note?': '+r.note:''}`}
function reminderEmail(r){
  const t=task(r.taskId), p=project(r.projectId), m=member(r.toMember), ms=t&&mstone(t.milestoneId), by=r.by==='owner'?'Project Manager SAMB Project Board':(mname(r.by)||'PM project');
  const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rows=[['Task',t.title],['Project',p?.name||''],ms?['Milestone',msNo(ms)+' · '+ms.title]:null,['Jadwal',range(t.start,t.end)],['Status',STAGES.find(s=>s.id===t.stage)?.name||''],t.proof?['Bukti yang diminta',t.proof]:null].filter(Boolean);
  const subject=`[SAMB] Pengingat dari ${by}: ${t.title}`;
  const text=`${r.message}\n\n`+rows.map(([k,v])=>`${k}: ${v}`).join('\n')+`\n\nBuka SAMB Project Board:\n${APP_URL}\n\nPengingat ini dikirim oleh ${by} lewat SAMB Project Board.`;
  const html=`<div style="font-family:Arial,Helvetica,sans-serif;color:#14212c;max-width:560px;line-height:1.5"><p style="white-space:pre-wrap">${E(r.message)}</p><table style="border-collapse:collapse;font-size:14px">${rows.map(([k,v])=>`<tr><td style="padding:3px 14px 3px 0;color:#66727e;vertical-align:top">${E(k)}</td><td style="padding:3px 0"><b>${E(v)}</b></td></tr>`).join('')}</table><p style="margin-top:22px"><a href="${APP_URL}" style="background:#14212c;color:#fff;padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:bold">Buka SAMB Project Board</a></p><p style="color:#66727e;font-size:12px">Pengingat ini dikirim oleh ${E(by)} lewat SAMB Project Board.</p></div>`;
  return {to:m?.email||'',subject,text,html};
}

  else if(D.editms){openMs(D.editms)}
  else if(D.msup){moveMs(D.msup,-1)}
  else if(D.msdown){moveMs(D.msdown,1)}
  else if(D.newtaskMs){openTask(null,{milestoneId:D.newtaskMs})}
  else if(D.delm){if(!isAdmin())return;const b=el;if(b.dataset.arm){const id=D.delm;
      S.tasks.filter(t=>t.assignee===id||t.validator===id).forEach(t=>put('tasks',{...t,assignee:t.assignee===id?'':t.assignee,validator:t.validator===id?'':t.validator}));
      S.milestones.filter(m=>m.approver===id).forEach(m=>put('milestones',{...m,approver:''}));
      S.asks.filter(a=>a.decider===id).forEach(a=>put('asks',{...a,decider:''}));
      S.projects.filter(x=>x.owner===id).forEach(x=>put('projects',{...x,owner:''}));
      if(UI.asWho===id){UI.asWho='';saveUI()}
      del('members',id);toast('Anggota dihapus')}else{b.dataset.arm=1;b.textContent='Yakin?';b.classList.add('danger')}}
  else if(D.act==='newProject')startWizard();
  else if(D.act==='editProject')openProject(UI.pid);
  else if(D.act==='newTask')openTask();
  else if(D.act==='newMs')openMs();
  else if(D.act==='drawer')app.classList.toggle('drawer');
});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[data-cal]');if(!a)return;calRecord(a.dataset.cal);
  const st=document.getElementById('calState');if(st)st.textContent='Sudah kamu tambahkan ke kalender. Simpan event-nya di tab yang baru terbuka.';render()});
document.addEventListener('change',e=>{if(e.target.id==='fWho'){UI.who=e.target.value;saveUI();render()}if(e.target.id==='fAs'){UI.asWho=e.target.value;saveUI();render()}});
let qT;document.addEventListener('input',e=>{if(e.target.id==='fQ'){clearTimeout(qT);qT=setTimeout(()=>{UI.q=e.target.value;renderMain();const i=$('#fQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}});
document.addEventListener('submit',e=>{if(e.target.id==='addMember'){e.preventDefault();if(!isAdmin()||RO)return;const name=$('#mName').value.trim();
  const er=need([[$('#mName'),'Isi nama anggota.'],[$('#mRole'),'Isi jabatan / divisi.'],[$('#mEmail'),'Isi email kantor.'],[$('#mAcc'),'Pilih peran.']]);if(er){$('#mErr').textContent=er;return}$('#mErr').textContent='';
  const email=($('#mEmail')?.value||'').trim().toLowerCase(), err=emailErr(email,null);if(err){$('#mErr').textContent=markBad($('#mEmail'),err);return}
  put('members',{id:uid(),name,role:$('#mRole').value.trim(),email,access:$('#mAcc').value,emailDaily:true,createdAt:Date.now()});toast(name+' ditambahkan')}});
document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('.kcard');if(c&&e.key==='Enter'&&e.target===c)openTask(c.dataset.card)});
document.addEventListener('mousedown',e=>{if($('#app').classList.contains('drawer')&&e.target.closest('#app')&&!e.target.closest('.side')&&!e.target.closest('.menu-btn'))$('#app').classList.remove('drawer')});

init();
</script>
