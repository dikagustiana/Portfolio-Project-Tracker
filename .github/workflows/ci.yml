name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: No env files committed (BRIEF §2.1)
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::An .env file is tracked by git. Remove it and rotate any keys it held."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the Supabase CLI pinned in package.json, so CI and local runs use one version.
      - run: npm ci

      - name: Start local Postgres and apply migrations
        run: npx supabase db start

      - name: Run pgTAP suite (security guard, access matrix A1–A17, workflow)
        run: npx supabase test db

      - name: Lint database functions (plpgsql_check)
        run: npm run db:lint

      - name: Access policy report is current
        run: |
          npm run db:report
          git diff --exit-code docs/access-policies.md || {
            echo "::error::docs/access-policies.md is out of date. Run npm run db:report and commit it."
            exit 1
          }

      - name: Stop local Postgres
        if: always()
        run: npx supabase stop --no-backup

  integration:
    name: Integration (seed import, DB parity, API and Realtime isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start local Supabase (database, auth, REST, Realtime)
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor,storage-api,postgres-meta,edge-runtime

      # The local stack uses the CLI's well-known demo keys; nothing here is a real secret.
      - name: Export local endpoints
        run: |
          npx supabase status -o env | tr -d '"' > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed import and verification report (BRIEF section 7)
        run: node scripts/import-seed.ts run --db-url "$SUPABASE_DB_URL"

      - name: Parity through the database and isolation through the API
        run: npx vitest run tests/integration

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
